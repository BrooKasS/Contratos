<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Contratos</title>
    <link rel="stylesheet" href="../styles/dashboard.css">
    <style>
        .autocomplete-list {
            position: absolute;
            background: white;
            border: 1px solid #ddd;
            max-height: 150px;
            overflow-y: auto;
            z-index: 1000;
            width: 100%; /* Igual ancho que input */
        }
        .autocomplete-list div {
            padding: 8px;
            cursor: pointer;
        }
        .autocomplete-list div:hover {
            background: #f0f0f0;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <img src="../styles/imagenes/ChatGPT Image 18 feb 2026, 19_59_56.png" alt="">
            <h1>Dashboard de Contratos</h1>
            <div class="nav-links">
                <a href="../index.html">Inicio</a>
                <a href="upload.html">Subir</a>
                <a href="dashboard.html" class="active">Contratos</a>
                <a href="seguimiento.html">Seguimiento de contratos</a>
        
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="header-section">
            <h2>Contratos</h2>
            <div class="header-actions">
                <!-- Botón de filtros en lugar de la barra de búsqueda -->
                <button id="btnFiltros" class="btn-filtros">🔍 Filtros</button>
                <button id="btnRecargar" class="btn-reload">🔄 Recargar</button>
                <button id="btnExportar" class="btn-export">📥 Exportar Excel</button>
            </div>
        </div>

        <div class="stats-card">
            <div class="stat-icon">📄</div>
            <div>
                <h4>Total Contratos</h4>
                <p id="totalContratos">0</p>
            </div>
        </div>

        <div class="contratos-section">
            <div class="section-header">
                <h2>Contratos</h2>
                <span id="resultadosCount" class="badge">0</span>
            </div>

            <div id="loadingSpinner" class="loading">
                <div class="spinner"></div>
                <p>Cargando...</p>
            </div>

            <div id="contratosGrid" class="grid"></div>

            <div id="noResults" class="no-results" style="display: none;">
                <p>🔍 No se encontraron contratos</p>
            </div>
        </div>
    </div>

    <!-- NUEVO MODAL DE FILTROS -->
    <div id="modalFiltros" class="modal" style="display: none;">
        <div class="modal-overlay" onclick="cerrarModalFiltros()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3>🔍 Filtros de Búsqueda</h3>
                <button class="modal-close" onclick="cerrarModalFiltros()">×</button>
            </div>
            <form id="formFiltros">
                <div class="modal-body">
                    <div class="form-group">
                        <label>No. Contrato</label>
                        <input type="text" id="filtroNumeroContrato" placeholder="Número de contrato">
                        <div id="autoCompleteNumero" class="autocomplete-list"></div>
                    </div>

                    <div class="form-group">
                        <label>Proveedor</label>
                        <input type="text" id="filtroProveedor" placeholder="Proveedor">
                        <div id="autoCompleteProveedor" class="autocomplete-list"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="limpiarFiltros()">Limpiar</button>
                    <button type="button" class="btn-save" onclick="aplicarFiltros()">Aplicar Filtros</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/dashboard.js"></script>
</body>
</html>
